name: CI

on:
  push:
    branches: [master, 'rebuild/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: No secrets committed
        # The repository previously tracked .env and aws-exports.js. Keep it that way.
        run: |
          if git ls-files | grep -E '(^|/)\.env$|aws-exports\.js|amplifyconfiguration\.json'; then
            echo "::error::A credentials file is tracked in git."
            exit 1
          fi
          echo "No credential files tracked."
